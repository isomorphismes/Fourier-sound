name: MIRO stripped release

on:
  push:
    branches:
      - 'release/miro-stripped'
      - 'fix/miro-smooth-render'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ANDROID_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Shared NativeActivity packager
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 7c61ee43e75f7c2dab9288edb0e10055898b36e6
          path: .android-ndk
          sparse-checkout: apk

      - name: Stable public test signer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Qualify the existing fortified ICK Android profile
        uses: isomorphisms/ai-ci/ick-android@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        id: android-ick
        with:
          abi: armeabi-v7a
          ndk: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          fortify-source: '2'

      - name: Build only stripped MIRO APK
        shell: bash
        run: |
          set -euxo pipefail
          make android-miro-release \
            ICK_ARMV7="${{ steps.android-ick.outputs.compiler }}" \
            ICK_BIONIC_HEADERS="${{ steps.android-ick.outputs.header_overlay }}"
          apk=build/fourier-voice-miro-release.apk
          so=build/release/ndk/lib/armeabi-v7a/libfourier_voice.so
          debug=build/symbols/ndk/libfourier_voice.so.debug
          printf 'apk_bytes\t%s\nso_bytes\t%s\ndebug_bytes\t%s\n' \
            "$(stat -c %s "$apk")" "$(stat -c %s "$so")" "$(stat -c %s "$debug")" \
            | tee build/miro-release-size.tsv
          unzip -Z1 "$apk" | tee build/miro-release-entries.txt
          ! grep -E '(^|/)classes[0-9]*\.dex$' build/miro-release-entries.txt
          ! "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -S "$so" | grep -q '\.debug_'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fourier-voice-miro-stripped-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/fourier-voice-miro-release.apk
            build/fourier-voice-miro-release.apk.sha256
            build/miro-release-size.tsv
            build/symbols/ndk/libfourier_voice.so.debug
          if-no-files-found: error

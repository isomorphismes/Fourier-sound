name: MIRO stripped release

on:
  push:
    branches:
      - 'release/miro-stripped'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Stable public test signer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Build only stripped MIRO APK
        shell: bash
        run: |
          set -euxo pipefail
          make android-miro-release
          apk=build/fourier-voice-miro-release.apk
          so=build/release/ndk/lib/armeabi-v7a/libfourier_voice.so
          debug=build/symbols/ndk/libfourier_voice.so.debug
          printf 'apk_bytes\t%s\nso_bytes\t%s\ndebug_bytes\t%s\n' \
            "$(stat -c %s "$apk")" "$(stat -c %s "$so")" "$(stat -c %s "$debug")" \
            | tee build/miro-release-size.tsv
          unzip -Z1 "$apk" | tee build/miro-release-entries.txt
          ! grep -E '(^|/)classes[0-9]*\.dex$' build/miro-release-entries.txt
          ! "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -S "$so" | grep -q '\.debug_'

      - uses: actions/upload-artifact@v4
        with:
          name: fourier-voice-miro-stripped-${{ github.sha }}
          path: |
            build/fourier-voice-miro-release.apk
            build/fourier-voice-miro-release.apk.sha256
            build/miro-release-size.tsv
            build/symbols/ndk/libfourier_voice.so.debug
          if-no-files-found: error

name: Florence Nightingale profile preview

on:
  push:
    branches:
      - experiments/nightingale-fourier-movie
    paths:
      - .github/workflows/nightingale-profile-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gif:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact movie branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Derive an animated preview from the actual movie
        shell: bash
        run: |
          set -euo pipefail
          movie=media/florence-nightingale-fourier-voice.mp4
          preview=media/florence-nightingale-fourier-voice-preview.gif
          test -s "$movie"
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -ss 2 -t 8 -i "$movie" \
            -filter_complex '[0:v]fps=4,scale=180:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=3' \
            -loop 0 "$preview"
          test -s "$preview"
          ffprobe -v error -show_entries stream=width,height,nb_frames \
            -of default=noprint_wrappers=1 "$preview"
          sha256sum "$movie" "$preview"
      - name: Commit preview alongside the source movie
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/florence-nightingale-fourier-voice-preview.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Nightingale animated profile preview [skip ci]'
          git push origin HEAD:experiments/nightingale-fourier-movie

name: GPU Fourier reference driver
on:
  pull_request:
  push:
    branches: ['gpu/fft-wegert-resident']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        id: ick
      - name: Install host GLES driver headers
        run: sudo apt-get update
      - run: sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/Fourier-sound
          ref: 930b24d2311539e345255877830aaf86c9da3410
          path: .nightingale
          sparse-checkout: examples/autogenerated/wiggle-audio/trace/clip.s16
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Execute production shaders against the independent DFT
        run: make gpu-reference-test ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}" GPU_REFERENCE_PCM=.nightingale/examples/autogenerated/wiggle-audio/trace/clip.s16
# All three ABI GPU APKs, import checks, and sizes are built by native-audio.yml.

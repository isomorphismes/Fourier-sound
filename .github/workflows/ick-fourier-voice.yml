name: ICK Fourier Voice ARMv7

on:
  push:
    branches:
      - 'ick/fourier-voice-miro-a1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ICK_COMMIT: c61e448251744a2f40ad743ebef1a027bdcd2f9d
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out Fourier Voice
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        id: host-ick
      - name: Run host reference tests with the literal-glyph frontend
        run: make test ICK="${{ steps.host-ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.host-ick.outputs.link_flags }}"

      - name: Shared NativeActivity packager
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 7c61ee43e75f7c2dab9288edb0e10055898b36e6
          path: .android-ndk
          sparse-checkout: apk

      - name: Stable public test signer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Qualify the existing fortified ICK Android profile
        uses: isomorphisms/ai-ci/ick-android@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        id: android-ick
        with:
          abi: armeabi-v7a
          ndk: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          fortify-source: '2'

      - name: Compile and inspect the specialized ICK A32 polynomial leaf
        shell: bash
        run: |
          set -euxo pipefail
          ick="${{ steps.android-ick.outputs.compiler }}"
          tools="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p build/ick/armeabi-v7a
          "$ick" \
            -march=armv7-a -marm -mfpu=vfpv3-d16 -mfloat-abi=softfp \
            -std=c11 -O2 -fPIC -ffreestanding -nostdinc \
            -fvisibility=hidden \
            -S fourier/ick_polynomial_leaf.c \
            -o build/ick/armeabi-v7a/fourier_voice_leaf.s
          "$tools/armv7a-linux-androideabi26-clang" -marm -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=softfp \
            -c build/ick/armeabi-v7a/fourier_voice_leaf.s -o build/ick/armeabi-v7a/fourier_voice_leaf.o

          "$tools/llvm-readelf" -h build/ick/armeabi-v7a/fourier_voice_leaf.o \
            | tee build/ick/armeabi-v7a/ick-leaf.elf
          arm-linux-gnueabi-readelf -A build/ick/armeabi-v7a/fourier_voice_leaf.o \
            | tee build/ick/armeabi-v7a/ick-leaf.attributes
          grep -q 'Machine:.*ARM' build/ick/armeabi-v7a/ick-leaf.elf
          grep -q 'Tag_CPU_arch: v7' build/ick/armeabi-v7a/ick-leaf.attributes
          grep -q 'Tag_ARM_ISA_use: Yes' build/ick/armeabi-v7a/ick-leaf.attributes
          grep -q 'Tag_ABI_align_needed: 8-byte' build/ick/armeabi-v7a/ick-leaf.attributes
          "$tools/llvm-readelf" -s build/ick/armeabi-v7a/fourier_voice_leaf.o > build/ick/armeabi-v7a/ick-leaf.symbols
          grep -q '\$a' build/ick/armeabi-v7a/ick-leaf.symbols
          ! grep -q '\$t' build/ick/armeabi-v7a/ick-leaf.symbols
          if grep -q 'Tag_ABI_VFP_args: VFP registers' build/ick/armeabi-v7a/ick-leaf.attributes; then
            echo 'hard-float ABI is not Android armeabi-v7a' >&2
            exit 1
          fi
          "$tools/llvm-nm" -u build/ick/armeabi-v7a/fourier_voice_leaf.o \
            | tee build/ick/armeabi-v7a/ick-leaf.undefined

      - name: Build MIRO-only diagnostic and stripped release APKs
        shell: bash
        run: |
          set -euxo pipefail
          make android-ick-leaf-armv7 miro-release-compare \
            ICK_ARMV7="${{ steps.android-ick.outputs.compiler }}" \
            ICK_BIONIC_HEADERS="${{ steps.android-ick.outputs.header_overlay }}" \
            ICK_ARMV7_OBJECT="$GITHUB_WORKSPACE/build/ick/armeabi-v7a/fourier_voice_leaf.o"
          printf '%s\n' "$ICK_COMMIT" > build/ick-source-commit.txt
          git rev-parse HEAD > build/fourier-sound-source-commit.txt

      - name: Record exact stripped size comparison
        shell: bash
        run: |
          set -euxo pipefail
          ndk_so=build/release/ndk/lib/armeabi-v7a/libfourier_voice.so
          ick_so=build/release/ick/lib/armeabi-v7a/libfourier_voice.so
          ndk_apk=build/fourier-voice-miro-release.apk
          ick_apk=build/fourier-voice-ick-leaf-miro-release.apk
          ndk_debug=build/symbols/ndk/libfourier_voice.so.debug
          ick_debug=build/symbols/ick/libfourier_voice.so.debug
          {
            printf 'variant\tso_bytes\tapk_bytes\tseparate_debug_bytes\n'
            printf 'ICK-baseline\t%s\t%s\t%s\n' \
              "$(stat -c %s "$ndk_so")" "$(stat -c %s "$ndk_apk")" "$(stat -c %s "$ndk_debug")"
            printf 'ICK-specialized-leaf\t%s\t%s\t%s\n' \
              "$(stat -c %s "$ick_so")" "$(stat -c %s "$ick_apk")" "$(stat -c %s "$ick_debug")"
          } | tee build/miro-release-sizes.tsv
          ndk_apk_bytes="$(stat -c %s "$ndk_apk")"
          ick_apk_bytes="$(stat -c %s "$ick_apk")"
          printf 'leaf_minus_baseline_apk_bytes\t%s\n' "$((ick_apk_bytes - ndk_apk_bytes))" \
            | tee -a build/miro-release-sizes.tsv
          {
            echo '### MIRO stripped release sizes'
            echo
            echo '~~~text'
            cat build/miro-release-sizes.tsv
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify packaged native libraries are stripped ARMv7 and no-DEX
        shell: bash
        run: |
          set -euxo pipefail
          for variant in ndk ick; do
            if [ "$variant" = ndk ]; then
              apk=build/fourier-voice-miro-release.apk
            else
              apk=build/fourier-voice-ick-leaf-miro-release.apk
            fi
            unzip -p "$apk" lib/armeabi-v7a/libfourier_voice.so > "build/libfourier_voice-$variant.so"
            "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "build/libfourier_voice-$variant.so" | tee "build/$variant-final.elf"
            grep -q 'Class:.*ELF32' "build/$variant-final.elf"
            grep -q 'Machine:.*ARM' "build/$variant-final.elf"
            ! "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -S "build/libfourier_voice-$variant.so" | grep -q '\.debug_'
            ! unzip -Z1 "$apk" | grep -E '(^|/)classes[0-9]*\.dex$'
          done
          "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" build/android/armeabi-v7a/voice-ick-release-unstripped/lib/armeabi-v7a/libfourier_voice.so \
            | grep -q 'fourier_polynomial_cartesian_ick'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fourier-voice-ick-leaf-miro-a1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/fourier-voice-ick-leaf-armeabi-v7a.apk
            build/fourier-voice-ick-leaf-armeabi-v7a.apk.sha256
            build/fourier-voice-miro-release.apk
            build/fourier-voice-miro-release.apk.sha256
            build/fourier-voice-ick-leaf-miro-release.apk
            build/fourier-voice-ick-leaf-miro-release.apk.sha256
            build/miro-release-sizes.tsv
            build/symbols/ndk/libfourier_voice.so.debug
            build/symbols/ick/libfourier_voice.so.debug
            build/ick/armeabi-v7a/fourier_voice_leaf.o
            build/ick/armeabi-v7a/ick-leaf.elf
            build/ick/armeabi-v7a/ick-leaf.attributes
            build/ick/armeabi-v7a/ick-leaf.undefined
            build/ick-source-commit.txt
            build/fourier-sound-source-commit.txt
          if-no-files-found: error

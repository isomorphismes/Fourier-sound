name: Nightingale splice verification

on:
  push:
    branches:
      - experiments/nightingale-splice

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build and test transcript-aligned splice
        run: make nightingale-splice-test

      - name: Record source and splice durations
        shell: bash
        run: |
          {
            printf 'source\t'
            ffprobe -v error -show_entries format=duration -of csv=p=0 build/media/nightingale-second.ogg
            printf 'splice\t'
            ffprobe -v error -show_entries format=duration -of csv=p=0 build/media/nightingale-memory-name.flac
          } | tee build/media/nightingale-durations.tsv

      - name: Make splice waveform
        shell: bash
        run: |
          ffmpeg -nostdin -loglevel error -y \
            -i build/media/nightingale-memory-name.flac \
            -filter_complex 'aformat=channel_layouts=mono,showwavespic=s=2400x500:split_channels=0' \
            -frames:v 1 build/media/nightingale-memory-name-waveform.png

      - name: Upload verified splice
        uses: actions/upload-artifact@v4
        with:
          name: nightingale-memory-name
          path: |
            build/media/nightingale-memory-name.flac
            build/media/nightingale-memory-name-waveform.png
            build/media/nightingale-durations.tsv
            tests/media/nightingale.md
            tests/media/nightingale-alignment.tsv

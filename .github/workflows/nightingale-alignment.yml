name: Nightingale alignment probe

on:
  push:
    branches:
      - experiments/nightingale-splice

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch archival second rendition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nightingale
          url='https://upload.wikimedia.org/wikipedia/commons/3/31/Florence_Nightingale_voice_-_1576A_2nd_Rendition.ogg'
          curl --fail --location --retry 3 --output build/nightingale/source.ogg "$url"
          printf '%s  %s\n' '5de570b67b20f4e2932fb960b3e3b0f071981544' build/nightingale/source.ogg | sha1sum -c -
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 build/nightingale/source.ogg

      - name: Probe likely phrase boundaries
        shell: bash
        run: |
          set -euo pipefail
          for threshold in -20 -24 -28 -32 -36 -40; do
            echo "===== silencedetect ${threshold} dB ====="
            ffmpeg -nostdin -hide_banner -i build/nightingale/source.ogg \
              -af "silencedetect=noise=${threshold}dB:d=0.10" \
              -f null - 2>&1 | grep -E 'silence_(start|end|duration)' || true
          done | tee build/nightingale/silence-boundaries.txt

      - name: Make inspection images
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -nostdin -loglevel error -y -i build/nightingale/source.ogg \
            -filter_complex 'aformat=channel_layouts=mono,showwavespic=s=2400x500:split_channels=0' \
            -frames:v 1 build/nightingale/waveform.png
          ffmpeg -nostdin -loglevel error -y -i build/nightingale/source.ogg \
            -lavfi 'showspectrumpic=s=2400x1000:legend=1:scale=log' \
            -frames:v 1 build/nightingale/spectrum.png

      - name: Upload alignment evidence
        uses: actions/upload-artifact@v4
        with:
          name: nightingale-alignment
          path: |
            build/nightingale/waveform.png
            build/nightingale/spectrum.png
            build/nightingale/silence-boundaries.txt
